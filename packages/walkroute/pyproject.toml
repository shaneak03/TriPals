[project]
name = "walkroute"
version = "0.2.0"
description = "Scenic walking routes for TriPals: OSM download, street scoring and route planning, shared by scripts/routing and services/routing-api."
requires-python = ">=3.11"
dependencies = [
  "osmnx>=2.0,<3",
  "geopandas>=1.0",
  "shapely>=2.0",
  "networkx>=3.2",
  "pyproj>=3.6",
  "scipy>=1.11",
  "supabase>=2.0,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["walkroute"]
